[project]
name = "q-insubiz"
version = "0.1.0"
description = "Insubiz browser- og API-integration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "automation-server-client",
    "openpyxl>=3.1.5",
    "playwright>=1.59.0",
]

[tool.uv.sources]
automation-server-client = { git = "https://github.com/odense-rpa/automation-server-client.git", tag = "v0.3.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["q_insubiz"]
